@if (images().length > 0) {
  <div class="carousel">
    <button type="button" class="carousel__nav" (click)="previous()" aria-label="Previous screenshot">‹</button>
    <button
      type="button"
      class="carousel__image-button"
      (click)="imageClick.emit(images()[activeIndex()])"
      aria-label="View full-size screenshot"
    >
      <img class="carousel__image" [src]="images()[activeIndex()]" alt="Screenshot" />
    </button>
    <button type="button" class="carousel__nav" (click)="next()" aria-label="Next screenshot">›</button>
  </div>
  <div class="carousel__dots">
    @for (image of images(); track image; let i = $index) {
      <button
        type="button"
        class="carousel__dot"
        [class.carousel__dot--active]="i === activeIndex()"
        (click)="select(i)"
        [attr.aria-label]="'Go to screenshot ' + (i + 1)"
      ></button>
    }
  </div>
} @else {
  <div class="carousel carousel--empty">No screenshots yet</div>
}
