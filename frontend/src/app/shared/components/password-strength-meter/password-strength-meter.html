@if (password()) {
  <div class="strength-meter">
    <div class="strength-meter__bars">
      @for (level of levels; track level) {
        <span class="strength-meter__bar" [style.background]="level <= score() ? color() : ''"></span>
      }
    </div>
    <span class="strength-meter__label" [style.color]="color()">{{ label() }}</span>
  </div>
}
