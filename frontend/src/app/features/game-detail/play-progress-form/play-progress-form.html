<section class="play-progress-form" aria-labelledby="play-progress-heading">
  <h2 id="play-progress-heading">Play progress</h2>

  <div class="play-progress-form__row">
    <label class="play-progress-form__check">
      <input type="checkbox" [checked]="completed()" (change)="setCompleted($any($event.target).checked)" />
      Completed
    </label>
    @if (completed()) {
      <input
        type="date"
        aria-label="Completed on"
        [max]="today"
        [value]="completedOn()"
        (change)="completedOn.set($any($event.target).value)"
      />
    }
  </div>

  <div class="play-progress-form__row">
    <label class="play-progress-form__check">
      <input type="checkbox" [checked]="fullyCompleted()" (change)="setFullyCompleted($any($event.target).checked)" />
      100% completed
    </label>
    @if (fullyCompleted()) {
      <input
        type="date"
        aria-label="100% completed on"
        [min]="completedOn()"
        [max]="today"
        [value]="fullyCompletedOn()"
        (change)="fullyCompletedOn.set($any($event.target).value)"
      />
    }
  </div>

  <div class="play-progress-form__row">
    <label for="hours-played">Hours played</label>
    <input
      id="hours-played"
      type="number"
      min="0"
      step="0.1"
      placeholder="e.g. 12.5"
      [value]="hoursPlayed()"
      (input)="hoursPlayed.set($any($event.target).value)"
    />
  </div>

  <app-field-error [message]="validationError() ?? errorMessage()" />
  <div class="play-progress-form__actions">
    <button type="button" class="btn btn-primary" [disabled]="saving() || !!validationError()" (click)="submit()">
      Save progress
    </button>
    <output class="play-progress-form__saved" aria-live="polite">{{ savedMessage() }}</output>
  </div>
</section>
