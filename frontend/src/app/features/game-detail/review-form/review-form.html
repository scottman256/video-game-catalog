<form class="review-form" [formGroup]="form" (ngSubmit)="submit()">
  <h2>Rate this game</h2>
  <p class="review-form__hint">All categories are optional — rate as many as you like.</p>
  @for (category of categories; track category.key) {
    <div class="review-form__row">
      <label [for]="category.key">{{ category.label }} <span class="review-form__weight">({{ category.weightLabel }})</span></label>
      <div class="review-form__control">
        <input
          [id]="category.key"
          type="range"
          min="0"
          max="5"
          step="0.5"
          [value]="starsFor(category.key) ?? 0"
          (input)="setStars(category.key, +$any($event.target).value)"
        />
        <span class="review-form__value">{{ starsFor(category.key) ?? 'N/A' }}</span>
        <button type="button" class="btn btn-secondary review-form__clear" (click)="clear(category.key)">
          Clear
        </button>
      </div>
    </div>
  }
  <app-field-error [message]="errorMessage()" />
  <button type="submit" class="btn btn-primary" [disabled]="saving()">Save review</button>
</form>
