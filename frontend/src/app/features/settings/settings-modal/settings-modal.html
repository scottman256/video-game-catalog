@if (open()) {
  <div class="modal-backdrop" (click)="closed.emit()" (keydown.escape)="closed.emit()" tabindex="-1">
    <div class="settings-modal card" (click)="$event.stopPropagation()">
      <div class="settings-modal__header">
        <h2>Settings</h2>
        <button type="button" class="settings-modal__close" (click)="closed.emit()" aria-label="Close">✕</button>
      </div>
      <div class="settings-modal__row">
        <label for="dark-mode-toggle">Dark mode</label>
        <input
          id="dark-mode-toggle"
          type="checkbox"
          [checked]="darkMode()"
          [disabled]="saving()"
          (change)="toggleDarkMode()"
        />
      </div>
    </div>
  </div>
}
