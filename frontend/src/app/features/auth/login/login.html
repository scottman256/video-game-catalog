<div class="auth-card card">
  <h1>Log in</h1>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="form-field">
      <label for="identifier">Username or email</label>
      <input id="identifier" type="text" formControlName="identifier" autocomplete="username" />
    </div>
    <div class="form-field">
      <label for="password">Password</label>
      <input id="password" type="password" formControlName="password" autocomplete="current-password" />
    </div>
    <app-field-error [message]="errorMessage()" />
    <button type="submit" class="btn btn-primary" [disabled]="form.invalid || submitting()">Log in</button>
  </form>
  <p class="auth-card__switch">No account yet? <a routerLink="/register">Create one</a></p>
</div>
