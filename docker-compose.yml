name: video-game-catalog

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: video_game_catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-catalog}
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "catalog", "-d", "video_game_catalog"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://catalog:${POSTGRES_PASSWORD:-catalog}@db:5432/video_game_catalog
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-insecure-secret-key-please-change-in-production}
      PUBLIC_BASE_URL: http://localhost:${FRONTEND_PORT:-8080}/api
      UVICORN_ROOT_PATH: /api
    volumes:
      - uploads:/app/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  uploads:
